apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neo4j-sso
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [neo4j.example.internal]
      secretName: neo4j-sso-tls
  rules:
    - host: neo4j.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neo4j-sso
                port: {name: http}
